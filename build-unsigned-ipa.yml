name: Build unsigned Pulse Music IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app
        run: |
          xcodebuild -project PulseMusic/PulseMusic.xcodeproj \
            -scheme PulseMusic -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/PulseMusic.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -r PulseMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PulseMusic-unsigned-IPA
          path: PulseMusic-unsigned.ipa
          retention-days: 7
